[project]
name = "lesson-engine"
version = "0.1.0"
description = "Turn your Claude Code sessions into lessons that load into every future session."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
lesson-engine = "lesson_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lesson_engine"]
